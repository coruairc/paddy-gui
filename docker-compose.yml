# Run Paddy in a container.
#
#   docker compose up
#
# Then open http://localhost:8080.
#
# State lives on the host in ./paddy-data so projects and appearance survive
# image rebuilds.

services:
  paddy:
    image: ghcr.io/coruairc/paddy-gui:latest
    pull_policy: always
    container_name: paddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENCODE_WEB_HOST: 127.0.0.1
      # For LAN/remote access, change both the port binding/host and set a
      # random OPENCODE_WEB_TOKEN explicitly.
      OPENCODE_WEB_TOKEN: ${OPENCODE_WEB_TOKEN:-}
      PADDY_HOME: /state
    volumes:
      - ./paddy-data:/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
